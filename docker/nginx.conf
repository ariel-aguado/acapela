# Acapela: SPA estática (nuxt generate). Reemplaza a vercel.json.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Para el HEALTHCHECK del contenedor (sin logs).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Service worker y manifiesto de la PWA: siempre revalidar para que las
    # actualizaciones lleguen.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        default_type application/manifest+json;
        types { }
        try_files $uri =404;
    }

    # Himnarios y su índice: siempre revalidar (el SW ya los guarda offline).
    location ^~ /songs/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        charset utf-8;
        try_files $uri =404;
    }

    # Archivos con hash de Nuxt: inmutables. Si falta uno, 404 (no index.html).
    location ^~ /_nuxt/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Páginas: el HTML siempre se revalida; rutas desconocidas → la SPA.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Resto de estáticos (imágenes, íconos, css, fuentes): una hora.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|css|js|woff2?|ttf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
